name: Apply curved topology fix

on:
  push:
    paths:
      - '.github/trigger-curved-topology-fix.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply topology patch
        run: python3 scripts/apply-curved-topology-fix.py
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit topology fix
        run: |
          git config user.name "Aram9988"
          git config user.email "145191963+Aram9988@users.noreply.github.com"
          git add src/v8/TeamTree.tsx
          git commit -m "Restore aligned curved topology connectors"
          git push origin main
