name: Apply role workflow patch

on:
  push:
    paths:
      - '.github/workflows/apply-role-workflow-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-role-workflow-fix.py
      - name: Validate diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v8/App.tsx src/v8/WorkDetail.tsx
          git commit -m "Fix role-aware completion approval workflow [skip ci]"
          git push origin HEAD:main
