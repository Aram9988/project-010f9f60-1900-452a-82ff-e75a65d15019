name: Fix Diwan tasks navigation

on:
  push:
    paths:
      - .github/workflows/fix-diwan-tasks-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Tasks navigation for Diwan
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/v8/App.tsx")
          text = path.read_text()
          old = '  const canTasks = hasPermission(org, currentUser, "create_tasks") || items.some((i) => kindOf(i) === "task");'
          new = '  const canTasks = diwanUser || hasPermission(org, currentUser, "create_tasks") || items.some((i) => kindOf(i) === "task");'
          if old not in text:
              raise SystemExit("canTasks line not found")
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v8/App.tsx
          git diff --cached --check
          git commit -m "Always show Tasks navigation for Diwan users"
          git push
